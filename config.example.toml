# deskfolds configuration
#
# You don't need to edit this file: tray icon > Settings… manages folders,
# shortcuts, looks and behavior, and saves them here. If you do edit it by
# hand, deskfolds notices before its next save and asks which version to keep.
# The last 5 versions are kept in the "backups" folder next to this file.
#
# Each [[panel]] is a small glass folder on the desktop. Hover it to open it,
# move the mouse away to close it, click its name to pin it open, and click a
# shortcut to launch it. Panels are locked in place: they never move unless
# you unlock them (tray icon > "Unlock panels", or Settings > Folders >
# "Move on the desktop").
#
# Positions (x, y) are screen pixels from the top-left corner of the main
# monitor (negative values reach monitors on the left/top). If no monitor
# shows a folder anymore, it is shown on the nearest one until its monitor
# comes back; its saved position is kept.
#
# Sizes (width, font_size, icon_size, gap, cell_width) are in pixels at 100 %
# scaling and are scaled automatically with the monitor's DPI.
#
# Shortcut paths can be programs, documents, folders, .lnk shortcuts or URIs
# (https://..., ms-settings:...). Environment variables like %USERPROFILE%
# are expanded. Bare program names (notepad.exe) are searched in PATH.

[settings]
hover_open = true             # open on hover; false = open and close by clicking
open_delay_ms = 150           # hover time before a panel opens
close_delay_ms = 400          # time before it closes once the mouse has left
animation_ms = 200            # 0 = no animation
collapse_after_launch = true  # close after launching a shortcut (unless pinned)
font_size = 13
icon_size = 32

# Glass look. The tint colors the blurred glass; tint_opacity 0 is clear
# glass, 1 is a solid color.
tint = "#FFFFFF"
tint_opacity = 0.10
# Colors drawn on the glass: grays act like light, so a darker gray is more
# see-through (#000000 is invisible, #FFFFFF is solid white).
text = "#F2F2F2"
hover = "#2E2E2E"
border = "#3A3A3A"
accent = "#4CC2FF"            # border and pin marker

# Files dragged into a panel are moved into that panel's storage folder: its
# "storage" key, chosen when the panel is created as storage_dir\<title>\ and
# never renamed. Empty storage_dir = Documents\deskfolds. Hold Ctrl while
# dropping to keep the file where it is and only add a link to it.
storage_dir = ""

# Folder titles. A closed folder is as wide as the folder, and its name wraps
# onto up to title_lines lines (1 to 3) before it ends with "...".
# title_style: "centered", "left", "icon_above" (the icon above the name) or
# "fit" (the label is only as wide as the name, on one line).
title_style = "centered"
title_lines = 2
show_count = false            # the number of shortcuts next to the name
item_lines = 1                # lines for a shortcut's name under its icon (1 or 2)

# Arranging folders. While unlocked, a moved folder snaps to the edges of the
# other folders and of the screen, gap pixels away (hold Alt to place it
# freely). An opening folder pushes the folders stacked right under or above
# it out of its way (push_below = false: it covers them). Folders that touch
# open the same way, upwards when there is no room below them
# (open_upwards = false: always downwards).
snap = true
gap = 8
push_below = true
open_upwards = true
unlocked_open_all = false     # while unlocked: true = every folder open, false = open on hover
cell_width = 72               # column width of panels with fit_columns = true
new_folder_width = 300        # width of new folders

# The arrangement: the folders with arranged = true are placed in it, in the
# order of this file, and moved with it. Its frame can be dragged while
# unlocked. Shape: "row", "column" or "grid"; a grid has arrange_count
# columns (arrange_by = "columns", filled left to right) or rows ("rows",
# filled top to bottom). Anchor: top_left, top_center, top_right,
# middle_left, center, middle_right, bottom_left, bottom_center or
# bottom_right, moved by the offset (pixels). arrange_screen: empty for the
# main screen, or a monitor's device name such as \\.\DISPLAY2.
arrange_shape = "grid"
arrange_count = 3
arrange_by = "columns"
arrange_anchor = "top_left"
arrange_offset_x = 0
arrange_offset_y = 0
arrange_screen = ""
new_folders_join = true       # new folders join the arrangement (if it has folders)

# A panel with fit_columns = true is columns x cell_width wide (plus 12 px).
[[panel]]
title = "Apps"
x = 40
y = 40
width = 300
columns = 4

[[panel.item]]
name = "Notepad"
path = "notepad.exe"

[[panel.item]]
name = "Calculator"
path = "calc.exe"

[[panel.item]]
name = "Paint"
path = "mspaint.exe"

[[panel.item]]
name = "Explorer"
path = "explorer.exe"

[[panel]]
title = "Folders"
x = 360
y = 40
width = 300
columns = 4

[[panel.item]]
name = "Documents"
path = "%USERPROFILE%\\Documents"

[[panel.item]]
name = "Downloads"
path = "%USERPROFILE%\\Downloads"

[[panel.item]]
name = "Desktop"
path = "%USERPROFILE%\\Desktop"

[[panel.item]]
name = "Settings"
path = "ms-settings:"
icon = "%SystemRoot%\\ImmersiveControlPanel\\SystemSettings.exe"
