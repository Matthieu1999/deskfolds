# deskfolds configuration
#
# You don't need to edit this file: tray icon > Settings… manages folders,
# shortcuts, looks and behavior, and saves them here. If you do edit it by
# hand, deskfolds notices before its next save and asks which version to keep.
# The last 5 versions are kept in the "backups" folder next to this file.
#
# Each [[panel]] is a small glass folder on the desktop. Hover it to open it,
# move the mouse away to close it, click its name to pin it open, and click a
# shortcut to launch it. Panels are locked in place: they never move unless
# you unlock them (tray icon > "Unlock panels", or Settings > Folders >
# "Move on the desktop").
#
# Positions (x, y) are screen pixels from the top-left corner of the main
# monitor (negative values reach monitors on the left/top). If no monitor
# shows a folder anymore, it is shown on the nearest one until its monitor
# comes back; its saved position is kept.
#
# Sizes (width, font_size, icon_size) are in pixels at 100 % scaling and are
# scaled automatically with the monitor's DPI.
#
# Shortcut paths can be programs, documents, folders, .lnk shortcuts or URIs
# (https://..., ms-settings:...). Environment variables like %USERPROFILE%
# are expanded. Bare program names (notepad.exe) are searched in PATH.

[settings]
hover_open = true             # open on hover; false = open and close by clicking
open_delay_ms = 150           # hover time before a panel opens
close_delay_ms = 400          # time before it closes once the mouse has left
animation_ms = 200            # 0 = no animation
collapse_after_launch = true  # close after launching a shortcut (unless pinned)
font_size = 13
icon_size = 32

# Glass look. The tint colors the blurred glass; tint_opacity 0 is clear
# glass, 1 is a solid color.
tint = "#FFFFFF"
tint_opacity = 0.10
# Colors drawn on the glass: grays act like light, so a darker gray is more
# see-through (#000000 is invisible, #FFFFFF is solid white).
text = "#F2F2F2"
hover = "#2E2E2E"
border = "#3A3A3A"
accent = "#4CC2FF"            # border and pin marker

# Files dragged into a panel are moved into that panel's storage folder: its
# "storage" key, chosen when the panel is created as storage_dir\<title>\ and
# never renamed. Empty storage_dir = Documents\deskfolds. Hold Ctrl while
# dropping to keep the file where it is and only add a link to it.
storage_dir = ""

[[panel]]
title = "Apps"
x = 40
y = 40
width = 300
columns = 4

[[panel.item]]
name = "Notepad"
path = "notepad.exe"

[[panel.item]]
name = "Calculator"
path = "calc.exe"

[[panel.item]]
name = "Paint"
path = "mspaint.exe"

[[panel.item]]
name = "Explorer"
path = "explorer.exe"

[[panel]]
title = "Folders"
x = 360
y = 40
width = 300
columns = 4

[[panel.item]]
name = "Documents"
path = "%USERPROFILE%\\Documents"

[[panel.item]]
name = "Downloads"
path = "%USERPROFILE%\\Downloads"

[[panel.item]]
name = "Desktop"
path = "%USERPROFILE%\\Desktop"

[[panel.item]]
name = "Settings"
path = "ms-settings:"
icon = "%SystemRoot%\\ImmersiveControlPanel\\SystemSettings.exe"
